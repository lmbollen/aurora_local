# The pyauroralocal library. Its source lives inside the Home Assistant
# integration (custom_components/aurora_local/pyauroralocal) so HACS installs
# can use it without a download; this file builds it as a standalone package
# and sets up the development environment (uv sync; uv run pytest).

[project]
name = "pyauroralocal"
dynamic = ["version"]
description = "Local, read-only client for Adlar Castra Aurora heat pumps via their HF-LPT270 Wi-Fi module"
readme = "custom_components/aurora_local/pyauroralocal/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/lmbollen/aurora_local"
Issues = "https://github.com/lmbollen/aurora_local/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Home Assistant test harness (pins a Home Assistant release; needs Python 3.14)
    "pytest-homeassistant-custom-component; python_full_version >= '3.14.2'",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "custom_components/aurora_local/pyauroralocal/__init__.py"

[tool.hatch.build]
# Editable installs expose only the package, not the integration folder
# around it (its select.py would shadow the standard library module).
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["custom_components/aurora_local/pyauroralocal"]

[tool.hatch.build.targets.sdist]
only-include = ["custom_components/aurora_local/pyauroralocal", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# One-off research scripts: terse style is fine there
"analysis/*" = ["E702", "E731", "B007", "B905"]
