name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and test (nix + uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Lint
        run: nix develop --command uv run --locked ruff check .
      - name: Tests (library, offline, Home Assistant)
        run: nix develop --command uv run --locked pytest -q
      - name: Build library
        run: nix develop --command uv build
